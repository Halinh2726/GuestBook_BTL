{% extends "base.html" %}

{% block title %}Gửi lời nhắn{% endblock %}

{% block content %}

<div class="form-section">

  <h1>Gửi lời nhắn</h1>

  <p>Hãy nhập tên và lời nhắn của bạn.</p>

  <!-- Hien thi loi neu co -->
  {% if error %}
  <p style="color: red;">{{ error }}</p>
  {% endif %}

  <!-- Form nhap loi nhan -->
  <form action="{{ url_for('add') }}" method="POST">

    <!-- Nhap ten -->
    <p>
      <label for="name">Tên của bạn:</label>
    </p>

    <p>
      <input type="text" id="name" name="name" value="{{ name }}" placeholder="Nhập tên của bạn" maxlength="80">
    </p>

    <!-- Nhap noi dung -->
    <p>
      <label for="message">Lời nhắn:</label>
    </p>

    <p>
      <textarea id="message" name="message" rows="5" cols="40" maxlength="500"
        placeholder="Nhập lời nhắn của bạn">{{ message }}</textarea>
    </p>

    <!-- Nut gui -->
    <p>
      <button type="submit">Gửi lời nhắn</button>

      <a href="{{ url_for('index') }}">Hủy</a>
    </p>

  </form>

</div>

{% endblock %}
